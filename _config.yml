title: HR Monster
tagline: 人事の仕事を、モンスターに任せよう。
description: 人事の仕事を代わりにこなすAIスキルと、そのスキルから生まれた記事・ツールを公開するサイトです。スキルはダウンロードしても、プロンプトをコピーしても使えます。
author: Nobuaki
lang: ja

# GitHub Pages（https://nkitou-alt.github.io/hr_monster/）
url: https://nkitou-alt.github.io
baseurl: /hr_monster
repo_url: https://github.com/nkitou-alt/hr_monster

timezone: Asia/Tokyo
markdown: kramdown
permalink: /articles/:year/:month/:title/

collections:
  monsters:
    output: true
    permalink: /monsters/:name/
  skills:
    output: true
    permalink: /skills/:name/
  tools:
    output: true
    permalink: /tools/:name/

defaults:
  - scope: { path: "", type: monsters }
    values: { layout: monster }
  - scope: { path: "", type: skills }
    values: { layout: skill }
  - scope: { path: "", type: tools }
    values: { layout: tool }
  - scope: { path: "", type: posts }
    values: { layout: post }

plugins:
  - jekyll-feed

exclude:
  - README.md
  - _templates
  - skill-files
