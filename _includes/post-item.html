<li class="post-item">
  <a href="{{ include.post.url | relative_url }}">
    <div class="meta">
      <time>{{ include.post.date | date: "%Y.%m.%d" }}</time>
      {% for c in include.post.categories %}{% assign m = site.categories_meta[c] %}<span class="tag">{{ m.name | default: c }}</span>{% endfor %}
    </div>
    <h3>{{ include.post.title }}</h3>
    <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 90 }}</p>
  </a>
</li>
